<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03A2A5"><title>UMMA Delivery — заказ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui;background:#f5faf9;color:#153b39}main{max-width:720px;margin:auto;padding:24px}h1{color:#008e90}#map{height:340px;border-radius:14px}#status{padding:16px;background:white;border-radius:12px;margin:16px 0}button{background:#008e90;color:white;border:0;border-radius:8px;padding:12px}</style></head><body><main><h1>UMMA Delivery</h1><p id="status" role="status">Подключаемся к заказу…</p><div id="map" aria-label="Карта курьера"></div><p id="note">Координаты показываются только во время активной доставки. Обновление каждые 5 секунд.</p><button id="notify">Включить уведомления на этом устройстве</button></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import {createGuestTracker} from './src/delivery/guest-tracking.mjs';
const status=document.getElementById('status'),button=document.getElementById('notify');
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
let map=null,marker=null,lastState='';
const messages={waiting_courier:'Ищем курьера',accepted:'Курьер назначен',picked_up:'Курьер забрал заказ',in_transit:'Курьер в пути',delivered:'Заказ доставлен',completed:'Заказ завершён',cancelled:'Заказ отменён'};
button.onclick=async()=>{if(!('Notification' in window)){button.textContent='Уведомления не поддерживаются';return;}const result=await Notification.requestPermission();button.textContent=result==='granted'?'Уведомления включены для открытой страницы':'Уведомления не разрешены';};
try{const tracker=createGuestTracker({endpoint:'https://zwzojugspldexyyljwpr.supabase.co/functions/v1/umma-guest-delivery',token,onUpdate:d=>{status.textContent='Заказ №'+d.number+': '+(messages[d.state]||d.state||'Обрабатывается');if(lastState&&lastState!==d.state&&Notification.permission==='granted'&&document.hidden)new Notification('UMMA Delivery',{body:status.textContent});lastState=d.state;if(d.latitude!=null&&d.longitude!=null&&window.L){if(!map){map=L.map('map').setView([d.latitude,d.longitude],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);}if(!marker)marker=L.marker([d.latitude,d.longitude]).addTo(map);else marker.setLatLng([d.latitude,d.longitude]);map.panTo([d.latitude,d.longitude]);}},onError:()=>status.textContent='Нет связи с доставкой. Повторяем запрос…'});tracker.start();window.addEventListener('pagehide',()=>tracker.stop());}catch{status.textContent='Недействительная ссылка отслеживания';}
</script></body></html>
