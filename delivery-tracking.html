<!doctype html>
<html lang="ru" translate="no">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="referrer" content="no-referrer">
 <meta name="theme-color" content="#f5faf9">
 <meta name="google" content="notranslate">
 <title>UMMA Delivery</title>
 <link rel="stylesheet" href="css/brand.css">
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
 <link rel="stylesheet" href="css/public-tracking.css?v=2">
 <script src="js/cafe/public-menu-i18n.js?v=13"></script>
 <script defer src="js/core/screen-awake.js?v=1"></script>
</head>
<body>
 <main class="tracking">
  <header class="tracking-toolbar">
   <a href="menu/" id="back">Вернуться к меню</a>
   <select id="menuLanguage" aria-label="Language"></select>
  </header>
  <section class="tracking-map-area">
   <div id="map" hidden aria-label="Карта доставки"></div>
   <button id="center" type="button" hidden></button>
  </section>
  <section class="tracking-sheet" aria-labelledby="status">
   <p id="orderNumber"></p>
   <h1 id="status" role="status"></h1>
   <p id="eta" hidden></p>
   <p id="connection" role="status"></p>
   <details id="progress" hidden>
    <summary id="progressLabel"></summary>
    <ol id="stages"></ol>
   </details>
   <button id="notify" type="button"></button>
  </section>
 </main>
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <script src="js/maps/umma-maps.js"></script>
 <script src="js/maps/nha-trang-router.js?v=1"></script>
 <script src="js/cafe/order-inbox.js?v=8"></script>
 <script src="js/cafe/public-tracking.js?v=5"></script>
</body>
</html>
