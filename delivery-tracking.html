<!doctype html>
<html lang="ru" translate="no">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="referrer" content="strict-origin-when-cross-origin">
 <meta name="theme-color" content="#03A2A5">
 <meta name="google" content="notranslate">
 <title>UMMA Delivery</title>
 <link rel="icon" href="logo/assets/umma-logo.png">
 <link rel="stylesheet" href="css/brand.css?v=8">
 <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css?v=1.9.4">
 <link rel="stylesheet" href="css/public-tracking.css?v=map-screen-2">
 <script src="js/cafe/public-menu-i18n.js?v=13"></script>
 <script defer src="js/core/screen-awake.js?v=1"></script>
 <link rel="stylesheet" href="css/viewport.css?v=1">
</head>
<body>
 <main class="tracking">
  <header class="tracking-toolbar" aria-label="Навигация доставки">
   <a href="menu/" id="back" aria-label="Вернуться в меню" title="Вернуться в меню">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
   </a>
   <div class="tracking-heading">
    <h1 id="status" role="status">Подключаем карту доставки…</h1>
    <p id="orderNumber" hidden></p>
   </div>
   <img class="tracking-brand" src="logo/assets/umma-icon-192.png" alt="UMMA" width="36" height="36">
   <p id="connection" role="status" hidden></p>
  </header>
  <section class="tracking-map-area">
   <div id="map" hidden aria-label="Карта доставки"></div>
   <p id="mapNotice" role="status" hidden></p>
  </section>
 </main>
 <script src="assets/vendor/leaflet/leaflet.js?v=1.9.4"></script>
 <script src="js/maps/umma-maps.js?v=moped-1"></script>
 <script src="js/maps/nha-trang-router.js?v=1"></script>
 <script src="js/cafe/public-tracking.js?v=map-screen-2"></script>
</body>
</html>
