<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087e7b"><title>UMMA Cafe — Заказать халяльную еду</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#183735;background:#f3f8f7}*{box-sizing:border-box}body{margin:0}header{background:#087e7b;color:white;padding:20px 16px;text-align:center}header b{font-size:24px;letter-spacing:2px}header p{margin:5px 0;color:#fff8d8}main{max-width:720px;margin:auto;padding:16px}h1{font-size:22px}h2{font-size:19px}.notice{background:#fff9e9;border:1px solid #e8c57b;padding:12px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:white;padding:12px;border-radius:14px;box-shadow:0 2px 12px #0001}.product img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px}.product h3{font-size:15px;min-height:35px}.price{font-weight:700;color:#087e7b}.product button,.submit{background:#087e7b;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer;font-weight:700}.cart{background:white;border-radius:14px;padding:16px;margin:20px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.line button{border:0;padding:8px 12px;border-radius:8px}label{display:block;margin:12px 0;font-weight:600}input{display:block;width:100%;padding:12px;margin-top:5px;border:1px solid #bdc9c7;border-radius:8px;font-size:16px}.submit{width:100%;font-size:17px}.submit:disabled{opacity:.5}#result{padding:12px;white-space:pre-line}footer{text-align:center;color:#777;padding:20px}</style></head><body><header><b>✦ UMMA GLOBAL</b><p>HALAL UMMA · Nha Trang</p></header><main><h1>Закажите халяльную еду 🍽️</h1><p>Без Telegram и установки приложения</p><p class="notice">Первый запуск: только самовывоз. Оплата наличными при получении в HALAL UMMA.</p><h2>Меню</h2><p id="loading">Загружаем блюда…</p><div id="products" class="grid"></div><section class="cart"><h2>Ваша корзина</h2><div id="cart">Добавьте блюдо</div><h3 id="total"></h3><form id="form"><label>Ваше имя<input id="name" autocomplete="name" required maxlength="100" placeholder="Имя"></label><label>Номер телефона<input id="phone" autocomplete="tel" type="tel" required minlength="8" maxlength="32" placeholder="+84…"></label><button class="submit" id="submit" disabled>Оформить заказ</button></form><p id="result" role="status"></p></section></main><footer>UMMA GLOBAL · Halal</footer><script>const endpoint='https://zwzojugspldexyyljwpr.supabase.co/functions/v1/cafe-guest-order';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₫';let items=[],cart=new Map(),pendingKey=null;const source=new URLSearchParams(location.search).get('point')||'';function draw(){const root=$('products');root.replaceChildren();for(const p of items){const card=document.createElement('article');card.className='product';if(p.image_url){try{const u=new URL(p.image_url);if(u.protocol==='https:'){const img=document.createElement('img');img.src=u.href;img.loading='lazy';img.alt='';card.append(img)}}catch{}}const h=document.createElement('h3');h.textContent=p.name_ru||p.name_en||p.name_vi||'Блюдо';const price=document.createElement('p');price.className='price';price.textContent=fmt(p.price_vnd);const b=document.createElement('button');b.textContent='Добавить +';b.onclick=()=>{cart.set(p.id,(cart.get(p.id)||0)+1);drawCart()};card.append(h,price,b);root.append(card)}}function drawCart(){const root=$('cart');root.replaceChildren();let total=0;for(const [id,qty] of cart){const p=items.find(x=>x.id===id);if(!p)continue;total+=p.price_vnd*qty;const row=document.createElement('div');row.className='line';const label=document.createElement('span');label.textContent=(p.name_ru||p.name_en)+' × '+qty;const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>{if(qty===1)cart.delete(id);else cart.set(id,qty-1);drawCart()};row.append(label,minus);root.append(row)}if(!cart.size)root.textContent='Добавьте блюдо';$('total').textContent='Итого: '+fmt(total);$('submit').disabled=!cart.size}fetch(endpoint+'?catalog=1',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.ok)throw Error();items=d.products;$('loading').textContent=items.length?'':'Сейчас нет доступных блюд';draw();drawCart()}).catch(()=>{$('loading').textContent='Не удалось загрузить меню. Обновите страницу.'});$('form').onsubmit=async e=>{e.preventDefault();if(!cart.size)return;const b=$('submit');b.disabled=true;$('result').textContent='Отправляем заказ…';pendingKey=pendingKey||crypto.randomUUID();try{const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create',requestKey:pendingKey,locationId:'e22788bd-4734-4b3a-911e-ba103d52617a',name:$('name').value,phone:$('phone').value,point:source,items:[...cart].map(([productId,quantity])=>({productId,quantity}))})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Ошибка');$('result').textContent='✅ Заказ №'+d.order.orderNumber+' принят!\nСумма: '+fmt(d.order.totalVnd)+'\nСамовывоз · Оплата наличными при получении.\nСохраните номер заказа.';cart.clear();drawCart();pendingKey=null;$('form').hidden=true;}catch(err){$('result').textContent='❌ '+err.message+' Повторите отправку.';b.disabled=false}};</script></body></html>
