name: Publish UMMA on GitHub Pages (manual)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -R css js assets logo menu _site/
          cp umma-menu.webmanifest umma-staff.webmanifest umma-menu-sw.js _site/
          touch _site/.nojekyll
          node scripts/version-customer-menu.mjs _site "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
