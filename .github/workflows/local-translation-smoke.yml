name: UMMA local translation smoke
on:
  push:
    paths:
      - 'js/cafe/connect-local-translation.js'
      - '.github/workflows/local-translation-smoke.yml'
      - 'scripts/test-local-translation.mjs'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check published browser scripts
        run: |
          node --check js/cafe/connect-local-translation.js
          node --check js/cafe/connect-media.js
          node --check js/cafe/connect-admin.js
          node --check js/cafe/customer-connect.js
      - name: Install speech test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak
          npm install --no-save --no-package-lock @huggingface/transformers@3.8.1
      - name: Real inference smoke test
        run: node scripts/test-local-translation.mjs
