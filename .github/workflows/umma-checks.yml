name: Umma Global checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Verify app and isolated cafe workflows
        run: npm test
      - name: Verify Android notification recovery with JVM doubles
        run: python3 scripts/qa-android-relay.py

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: umma_qa
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Verify independent PostgreSQL sessions and overlapping transactions
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: umma_qa
          PGPASSWORD: isolated-ci-only
        run: node scripts/qa/run-postgres-concurrency.mjs
      - name: Verify Market commerce and independent stock races
        env:
          PGHOST: 127.0.0.1
          PGDATABASE: umma_qa
          PGPASSWORD: isolated-ci-only
        run: node scripts/qa-market-native.mjs
      - name: Verify database backup and restore in isolated PostgreSQL
        env:
          QA_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p artifacts
          docker exec "$QA_PG_CONTAINER" pg_dump -U postgres -Fc umma_qa > artifacts/market-recovery.dump
          docker exec "$QA_PG_CONTAINER" createdb -U postgres umma_restore_qa
          docker exec -i "$QA_PG_CONTAINER" pg_restore -U postgres -d umma_restore_qa < artifacts/market-recovery.dump
          expected=$(docker exec "$QA_PG_CONTAINER" psql -U postgres -d umma_qa -Atc "select count(*) from public.market_orders")
          restored=$(docker exec "$QA_PG_CONTAINER" psql -U postgres -d umma_restore_qa -Atc "select count(*) from public.market_orders")
          test "$expected" = "$restored"
          echo "PASS isolated database recovery: $restored Market orders restored"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-concurrency-evidence
          path: artifacts/postgres-concurrency.json
