name: Umma Global checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app code and critical flows
        run: node scripts/verify-app.mjs

      - name: Verify cafe launch regressions with isolated API doubles
        run: node scripts/qa-cafe-launch.mjs
