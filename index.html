<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff">

  <title>Umma Global</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="./css/app.css">
</head>

<body>

  <main id="app">

    <!-- HOME -->
    <section id="home-page" class="page active">

      <header class="hero">
        <div class="logo">UG</div>

        <h1>Umma Global</h1>

        <p>
          One ecosystem for life, business and community.
        </p>
      </header>


      <!-- WELCOME -->
      <section class="card welcome">

        <h2 id="welcome-message">
          As-salamu alaykum wa rahmatullahi wa barakatuh!
        </h2>

        <p id="user-language"></p>

      </section>


      <!-- ECOSYSTEM -->
      <h2 class="section-title">
        Umma Ecosystem
      </h2>


      <div class="grid">

        <!-- UMMA CAFE -->
        <button
          class="module-card"
          data-page="cafe-page"
        >
          <span>🍽️</span>

          <strong>
            Umma Cafe
          </strong>

          <small>
            Halal food and ordering
          </small>
        </button>


        <!-- UMMA MARKET -->
        <button
          class="module-card"
          data-page="market-page"
        >
          <span>🛒</span>

          <strong>
            Umma Market
          </strong>

          <small>
            Halal products and catalog
          </small>
        </button>


        <!-- SERVICES -->
        <button
          class="module-card"
          data-page="services-page"
        >
          <span>🌍</span>

          <strong>
            Services
          </strong>

          <small>
            Travel, hotels, transport and more
          </small>
        </button>


        <!-- COMMUNITY -->
        <button
          class="module-card"
          data-page="community-page"
        >
          <span>🤝</span>

          <strong>
            Community
          </strong>

          <small>
            People, help and connections
          </small>
        </button>


        <!-- BUSINESS -->
        <button
          class="module-card"
          data-page="business-page"
        >
          <span>💼</span>

          <strong>
            Business
          </strong>

          <small>
            Businesses and opportunities
          </small>
        </button>


        <!-- EDUCATION -->
        <button
          class="module-card"
          data-page="education-page"
        >
          <span>📚</span>

          <strong>
            Education
          </strong>

          <small>
            School, medrese and university
          </small>
        </button>

      </div>


      <!-- MISSION -->
      <section class="mission">

        <h2>
          Our intention
        </h2>

        <p>
          To build a useful ecosystem for the Ummah
          and develop halal projects for the sake of Allah.
        </p>

      </section>

    </section>


    <!-- CAFE -->
    <section
      id="cafe-page"
      class="page"
    ></section>


    <!-- MARKET -->
    <section
      id="market-page"
      class="page"
    ></section>


    <!-- SERVICES -->
    <section
      id="services-page"
      class="page"
    ></section>


    <!-- COMMUNITY -->
    <section
      id="community-page"
      class="page"
    ></section>


    <!-- BUSINESS -->
    <section
      id="business-page"
      class="page"
    ></section>


    <!-- EDUCATION -->
    <section
      id="education-page"
      class="page"
    ></section>

  </main>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
  ></div>


  <!-- APPLICATION -->
  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>

</html>
