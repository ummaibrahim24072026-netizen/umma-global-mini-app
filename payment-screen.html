<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#03A2A5">
  <title>UMMA · Ваш заказ</title>
  <link rel="stylesheet" href="css/brand.css?v=8">
  <link rel="stylesheet" href="css/payment-screen.css?v=welcome-display">
  <link rel="manifest" href="assets/umma-customer-display.webmanifest">
  <script defer src="js/core/screen-awake.js?v=customer-display"></script>
  <script defer src="js/core/pwa-registration.js?v=1"></script>
</head>
<body class="work-payment-screen">
  <main class="customer-display">
    <div id="screenWelcome" class="display-welcome" hidden>
      <img src="assets/umma-customer-welcome.jpg" width="823" height="1536"
        alt="HALAL UMMA · Welcome! · Chào mừng Quý khách! · Добро пожаловать!">
    </div>
    <header class="display-brand"><img src="logo/assets/umma-icon-192.png" alt="" width="48" height="48"><strong>HALAL UMMA</strong><button id="screenFullscreen" type="button" hidden>На весь экран</button></header>
    <section class="display-order" aria-label="Ваш заказ">
      <h1 id="screenNumber">Добро пожаловать · Welcome · Xin chào</h1>
      <ul id="screenItems" hidden aria-label="Позиции заказа"></ul>
    </section>
    <section class="display-payment" aria-label="Оплата заказа">
      <p id="screenTotalLabel" hidden>К оплате · Total</p>
      <strong id="screenTotal" hidden></strong>
      <p id="screenMethod" hidden></p>
      <div id="screenChange" hidden aria-live="polite">
        <span>Сдача · Change · Tiền thừa</span>
        <strong id="screenChangeAmount"></strong>
      </div>
      <p id="screenStatus" role="status" aria-live="polite">Ожидаем заказ от кассира · Waiting for your order</p>
      <div id="screenQr" aria-label="QR-код для оплаты" hidden></div>
      <div id="screenTransfer" hidden>
        <p id="screenTransferBank"></p>
        <p class="display-transfer-label">Номер для перевода · Phone number</p>
        <strong id="screenTransferPhone" dir="ltr"></strong>
        <p id="screenTransferRecipient"></p>
      </div>
      <p id="screenBank" hidden></p>
      <p id="screenConnection" role="status" hidden></p>
      <p id="screenDeviceHint" role="status" hidden></p>
    </section>
  </main>
  <script src="js/vendor/qrcode-generator.js"></script>
  <script src="js/cafe/product-photo.js"></script>
  <script src="js/cafe/payment-screen.js?v=language-2"></script>
</body>
</html>
